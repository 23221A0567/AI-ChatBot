<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Student Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Header -->

    <div class="header">

        <div class="logo">

            🎓

        </div>

        <div>

            <h1>AI Student Chatbot</h1>

            <p>Your College Assistant</p>

        </div>

        <button id="themeBtn">

            🌙

        </button>

    </div>

    <!-- Suggested Questions -->

    <div class="suggestions">

        <button class="suggestion">

            Admission Process

        </button>

        <button class="suggestion">

            Hostel Fee

        </button>

        <button class="suggestion">

            Library Timings

        </button>

        <button class="suggestion">

            Placement Companies

        </button>

    </div>

    <!-- Chat Area -->

    <div id="chat-box">

    </div>

    <!-- Typing Animation -->

    <div id="typing">

        🤖 AI is typing...

    </div>

    <!-- Bottom Input -->

    <div class="bottom">

        <input

            id="user-input"

            type="text"

            placeholder="Ask anything about college...">

        <button id="voice">

            <i class="fa-solid fa-microphone"></i>

        </button>

        <button id="send">

            Send

        </button>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
